services : 
  db : 
    image : pgvector/pgvector:pg16
    environment :
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB : ragdb
    ports :
      - "127.0.0.1:5432:5432"
    volumes :
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d

volumes :
  pgdata :
